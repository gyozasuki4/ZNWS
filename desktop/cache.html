<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline'"><title>Hive Beta · Local data</title><style>
:root{color-scheme:dark;font:14px Inter,system-ui,sans-serif}body{margin:0;padding:28px;background:#08111c;color:#e7f0f8}main{max-width:500px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#a9bac9;line-height:1.45}.card{border:1px solid #263a4d;border-radius:10px;background:#101d2a;padding:16px;margin:16px 0}.row{display:flex;justify-content:space-between;border-bottom:1px solid #263a4d;padding:8px 0}.row:last-child{border:0}button{width:100%;padding:10px;margin-top:10px;border:1px solid #456176;border-radius:7px;background:#163451;color:#fff;font:inherit;font-weight:650;cursor:pointer}button.danger{background:#652d32}#status{min-height:20px;color:#8ed8a2}
</style></head><body><main><h1>Local data</h1><p>Weather frames use persistent SSD storage under Electron’s user-data directory. Installed boundary datasets are retained separately from temporary weather cleanup.</p><section class="card"><div class="row"><span>Total cache</span><strong id="total">Loading…</strong></div><div class="row"><span>Radar</span><strong id="radar">—</strong></div><div class="row"><span>Satellite</span><strong id="satellite">—</strong></div><div class="row"><span>Models</span><strong id="models">—</strong></div><div class="row"><span>Maps / boundaries</span><strong id="maps">—</strong></div><div class="row"><span>Disk hits</span><strong id="hits">—</strong></div></section><button id="weather" class="danger">Clear weather cache</button><button id="tiles">Clear viewed map tiles</button><p id="status" role="status" aria-live="polite"></p></main><script>(()=>{const $=id=>document.getElementById(id),fmt=n=>{n=Number(n)||0;return n>1073741824?`${(n/1073741824).toFixed(1)} GB`:n>1048576?`${(n/1048576).toFixed(1)} MB`:`${Math.round(n/1024)} KB`};async function refresh(){const s=await window.hiveDesktop.getCacheStats();if(!s)return;$('total').textContent=`${fmt(s.bytes)} / ${fmt(s.limitBytes)}`;for(const k of ['radar','satellite','models','maps'])$(k).textContent=fmt(s.categories?.[k]);$('hits').textContent=String(s.stats?.persistentHits||0)}$('weather').onclick=async()=>{await window.hiveDesktop.clearWeatherCache();$('status').textContent='Temporary weather cache cleared.';refresh()};$('tiles').onclick=async()=>{await window.hiveDesktop.clearMapTiles();$('status').textContent='Viewed map tiles cleared; installed maps retained.';refresh()};refresh()})()</script></body></html>
