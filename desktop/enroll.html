<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Hive Beta workstation setup</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #08111c; color: #e7f0f8; }
    main { width: min(420px, calc(100vw - 44px)); padding: 30px; border: 1px solid #263a4d; border-radius: 14px; background: #101d2a; box-shadow: 0 18px 60px #0008; }
    img { display: block; width: 64px; height: 64px; margin: 0 auto 18px; }
    h1 { margin: 0 0 8px; text-align: center; font-size: 23px; }
    p { color: #a9bac9; line-height: 1.45; }
    label { display: block; margin: 20px 0 6px; color: #dbe8f2; font-weight: 650; }
    input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #3b5267; border-radius: 7px; background: #0b1622; color: #fff; font: inherit; }
    button { width: 100%; margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 8px; background: #2786d8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { margin-top: 10px; background: transparent; border: 1px solid #456176; color: #dbe8f2; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { min-height: 24px; margin: 18px 0 0; color: #f4c77c; }
    #status.success { color: #7ed99a; }
    #status.error { color: #ff9d9d; }
    small { display: block; margin-top: 18px; color: #8095a8; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <img src="../znws-map-mark.png" alt="ZASNet">
    <h1>Set up this workstation</h1>
    <p>Enter the enrollment code generated by the Hive operations administrator. The code is single-use and expires shortly.</p>
    <form id="enroll-form">
      <label for="code">Enrollment code</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <label for="name">Workstation name <span>(optional)</span></label>
      <input id="name" name="name" autocomplete="off" maxlength="80" placeholder="This computer">
      <button id="enroll" type="submit">Enroll workstation</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <button class="secondary" id="retry" type="button" hidden>Retry stored credential</button>
    <button class="secondary" id="sso" type="button">Use SSO instead</button>
    <small>Credentials are handled by the Electron desktop process and stored using the operating system secure storage.</small>
  </main>
  <script>
    (() => {
      const form = document.querySelector("#enroll-form");
      const code = document.querySelector("#code");
      const name = document.querySelector("#name");
      const enroll = document.querySelector("#enroll");
      const retry = document.querySelector("#retry");
      const status = document.querySelector("#status");
      const setStatus = (text, kind = "") => { status.textContent = text; status.className = kind; };
      const reason = new URLSearchParams(location.search).get("reason");
      if (reason === "revoked") setStatus("This workstation is revoked. Enter a new enrollment code.", "error");
      else if (reason === "auth-failed") setStatus("The stored workstation credential is invalid. Enroll again or use SSO.", "error");
      const resultMessage = (result) => {
        if (result?.state === "invalid-code") return "Invalid, expired, or already used enrollment code.";
        if (result?.state === "server-unreachable") return "Server unreachable. Check the connection and try again.";
        if (result?.state === "revoked") return "This workstation is revoked. Enroll again with a new code.";
        return result?.message || "Enrollment failed. Try again.";
      };
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        enroll.disabled = true; retry.hidden = true; setStatus("Enrolling…");
        const result = await window.hiveDesktop.enrollWorkstation(code.value, name.value);
        if (result?.ok) { setStatus("Enrollment successful. Opening Hive…", "success"); return; }
        enroll.disabled = false;
        retry.hidden = result?.state !== "server-unreachable";
        setStatus(resultMessage(result), "error");
      });
      retry.addEventListener("click", async () => {
        retry.disabled = true; enroll.disabled = true; setStatus("Reconnecting…");
        const result = await window.hiveDesktop.retryWorkstation();
        if (result?.ok) { setStatus("Connected. Opening Hive…", "success"); return; }
        retry.disabled = false; enroll.disabled = false; setStatus(resultMessage(result), "error");
      });
      document.querySelector("#sso").addEventListener("click", () => window.hiveDesktop.useSso());
      code.focus();
    })();
  </script>
</body>
</html>
