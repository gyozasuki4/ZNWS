<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZASNet Storm Graphics</title><link rel="stylesheet" href="/tropics-site.css?v=storms-1"><style>main{max-width:1200px;margin:40px auto;padding:0 20px}.storm-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.storm-buttons button{padding:10px 14px;border:1px solid #79a8c4;border-radius:8px;background:#fff}.storm-buttons button.active{background:#176b9e;color:#fff}.viewer{background:#fff;border-radius:14px;padding:16px}.viewer img{display:block;width:100%;height:auto}.status{padding:16px;text-align:center}</style></head><body><main><p class="eyebrow">Official tropical cyclone products</p><h1 id="heading">Storm graphics</h1><div class="storm-buttons"><button data-product="forecast_cone" class="active">Forecast cone</button><button data-product="track_guidance">Track guidance</button><button data-product="intensity">Intensity</button><button data-product="storm_history">History</button></div><section class="viewer"><div id="status" class="status">Loading…</div><img id="graphic" alt="Official storm graphic" hidden></section></main><script>(()=>{const id=new URLSearchParams(location.search).get('id'),img=document.querySelector('#graphic'),st=document.querySelector('#status'),bs=[...document.querySelectorAll('[data-product]')];let product='forecast_cone';async function load(){st.textContent='Loading official graphic…';st.hidden=false;img.hidden=true;const r=await fetch('/api/public/tropics/storm-graphics/frames?id='+encodeURIComponent(id||'')+'&product='+product,{cache:'no-store'}),d=await r.json(),f=(d.frames||[]).find(x=>x.imageUrl);if(!r.ok||!f){st.textContent=d.error||'No graphic available';return}img.onload=()=>{img.hidden=false;st.hidden=true};img.onerror=()=>{st.textContent='Graphic failed to render'};img.src=f.imageUrl+'&v='+Date.now()}bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.remove('active'));b.classList.add('active');product=b.dataset.product;load()});load()})()</script></body></html>
