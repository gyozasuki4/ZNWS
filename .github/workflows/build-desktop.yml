name: Build ZNWS Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS desktop app
        run: npm run desktop:mac
      - name: Validate macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist-desktop -type d -name '*.app' -print -quit)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No macOS .app bundle found" >&2
            exit 1
          fi
          EXECUTABLE="${APP_PATH}/Contents/MacOS/ZASNet Hive Beta"
          file "${EXECUTABLE}"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PATH}/Contents/Info.plist"
          CODESIGN_DETAILS="$(codesign -dv --verbose=4 "${APP_PATH}" 2>&1 || true)"
          printf '%s\n' "${CODESIGN_DETAILS}"
          if printf '%s\n' "${CODESIGN_DETAILS}" | grep -Fq 'code has no resources but signature indicates they must be present'; then
            echo "Invalid partial macOS signature detected" >&2
            exit 1
          fi
          if codesign --verify --deep --strict --verbose=4 "${APP_PATH}"; then
            echo "macOS bundle signature verification passed"
          else
            VERIFY_OUTPUT="$(codesign --verify --deep --strict --verbose=4 "${APP_PATH}" 2>&1 || true)"
            printf '%s\n' "${VERIFY_OUTPUT}"
            if printf '%s\n' "${VERIFY_OUTPUT}" | grep -Fq 'code has no resources but signature indicates they must be present'; then
              echo "Invalid partial macOS signature detected" >&2
              exit 1
            fi
            echo "Unsigned macOS bundle accepted; no invalid partial signature present"
          fi
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-macOS
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run desktop:windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-Windows
          if-no-files-found: error
          path: dist-desktop/*.exe

  linux:
    name: Linux AppImage and DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run desktop:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-Linux
          if-no-files-found: error
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
