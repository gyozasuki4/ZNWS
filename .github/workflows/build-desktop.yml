name: Build ZNWS Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS desktop app
        run: npm run desktop:mac
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-macOS
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run desktop:windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-Windows
          if-no-files-found: error
          path: dist-desktop/*.exe

  linux:
    name: Linux AppImage and DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run desktop:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-Linux
          if-no-files-found: error
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
