name: Build ZNWS Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unpacked macOS desktop app
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: Sign and validate unpacked macOS application
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist-desktop -type d -name '*.app' -print -quit)"
          if [[ -z "${APP_PATH}" ]]; then
            echo "No macOS .app bundle found" >&2
            exit 1
          fi
          EXECUTABLE="${APP_PATH}/Contents/MacOS/ZASNet Hive Beta"
          file "${EXECUTABLE}"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PATH}/Contents/Info.plist")"
          [[ "${BUNDLE_ID}" == "com.zasnet.hivebeta" ]] || { echo "Unexpected bundle identifier: ${BUNDLE_ID}" >&2; exit 1; }
          codesign --force --deep --sign - "${APP_PATH}"
          codesign --verify --deep --strict --verbose=4 "${APP_PATH}"
          codesign -dv --verbose=4 "${APP_PATH}" 2>&1
      - name: Package validated macOS application
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find dist-desktop -type d -name '*.app' -print -quit)"
          npx electron-builder --prepackaged "${APP_PATH}" --mac dmg zip --publish never
      - name: Validate application inside macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find dist-desktop -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -n "${DMG_PATH}" ]] || { echo "No macOS DMG found" >&2; exit 1; }
          MOUNT_POINT="${RUNNER_TEMP}/znws-dmg"
          mkdir -p "${MOUNT_POINT}"
          hdiutil attach -nobrowse -readonly -mountpoint "${MOUNT_POINT}" "${DMG_PATH}"
          trap 'hdiutil detach "${MOUNT_POINT}" >/dev/null || true' EXIT
          DMG_APP="${MOUNT_POINT}/ZASNet Hive Beta.app"
          [[ -d "${DMG_APP}" ]] || { echo "No application found in mounted DMG" >&2; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${DMG_APP}/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "${DMG_APP}"
          codesign -dv --verbose=4 "${DMG_APP}" 2>&1
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-macOS
          if-no-files-found: error
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip

  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run desktop:windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-Windows
          if-no-files-found: error
          path: dist-desktop/*.exe

  linux:
    name: Linux AppImage and DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux packages
        run: npm run desktop:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZNWS-Linux
          if-no-files-found: error
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
