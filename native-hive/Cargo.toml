[package]
name = "zasnet-hive-native"
version = "0.3.0"
edition = "2024"
description = "Native ZASNet Hive weather operations client"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
